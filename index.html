<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Websim Vanilla Logo Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #4facfe 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 3rem;
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #f5576c, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            text-shadow: none;
            font-weight: bold;
        }

        .header p {
            font-size: 1.2rem;
            color: white;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .logo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logo-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
        }

        .logo-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(245, 87, 108, 0.1));
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid rgba(102, 126, 234, 0.2);
        }

        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .logo-title {
            font-size: 1.3rem;
            font-weight: bold;
            background: linear-gradient(45deg, #667eea, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .logo-description {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.4;
        }

        .rating-stars {
            margin: 1rem 0;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
        }

        .star {
            font-size: 1.5rem;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .star:hover,
        .star.active {
            color: #f5576c;
        }

        .generator-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 2rem;
        }

        .reference-section {
            margin-bottom: 2rem;
            text-align: center;
        }

        .reference-section h3 {
            font-size: 1.3rem;
            background: linear-gradient(45deg, #667eea, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .reference-images {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .reference-image {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            padding: 1rem;
            border: 2px solid rgba(102, 126, 234, 0.2);
        }

        .reference-image img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .reference-image p {
            font-size: 0.9rem;
            color: #666;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #667eea, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .input-group input, .input-group textarea, .input-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus, .input-group textarea:focus, .input-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .generate-btn {
            background: linear-gradient(45deg, #667eea, #f5576c);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            width: 100%;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .results-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .result-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
        }

        .result-image {
            width: 100%;
            max-width: 300px;
            height: 300px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(245, 87, 108, 0.1));
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid rgba(102, 126, 234, 0.2);
        }

        .result-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #667eea;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .preset-btn {
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.3);
            color: #667eea;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .preset-btn:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }

        .prompt-used {
            font-size: 0.9rem;
            color: #666;
            font-style: italic;
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🍦 Websim Vanilla Logo Generator</h1>
        <p>Create the perfect vanilla ice cream themed logo for Websim using AI. Blend the sweetness of vanilla with the simplicity of clean design!</p>
    </div>

    <div class="generator-container">
        <div class="reference-section">
            <h3>Reference Images for Color Palette</h3>
            <div class="reference-images">
                <div class="reference-image">
                    <img src="/a/7fd0da90-4658-48b7-91ea-26597c39bbad" alt="Websim Reference 1">
                    <p>Color Reference 1</p>
                </div>
                <div class="reference-image">
                    <img src="/a/51715d5d-3cca-4ec3-aeea-5be53a512ee4" alt="Websim Reference 2">
                    <p>Color Reference 2</p>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label for="logoPrompt">Logo Description</label>
            <textarea id="logoPrompt" rows="3" placeholder="Describe your vanilla ice cream themed Websim logo...">A minimalist vanilla ice cream logo for Websim, featuring a clean ice cream scoop or cone with the letter "W" integrated into the design, using soft cream colors and modern typography</textarea>
        </div>

        <div class="input-group">
            <label for="logoStyle">Style</label>
            <select id="logoStyle">
                <option value="minimalist">Minimalist</option>
                <option value="vintage">Vintage</option>
                <option value="modern">Modern</option>
                <option value="geometric">Geometric</option>
                <option value="playful">Playful</option>
                <option value="professional">Professional</option>
            </select>
        </div>

        <div class="input-group">
            <label for="colorScheme">Color Scheme</label>
            <select id="colorScheme">
                <option value="vanilla">Vanilla Cream (beige, cream, light brown)</option>
                <option value="websim">Websim Colors (blue, purple, teal)</option>
                <option value="mixed">Mixed (vanilla + websim)</option>
                <option value="monochrome">Monochrome</option>
            </select>
        </div>

        <div class="preset-buttons">
            <button class="preset-btn" onclick="setPreset('ice-cream-cone')">🍦 Ice Cream Cone</button>
            <button class="preset-btn" onclick="setPreset('scoop-w')">🫘 Scoop with W</button>
            <button class="preset-btn" onclick="setPreset('vanilla-bean')">🫘 Vanilla Bean</button>
            <button class="preset-btn" onclick="setPreset('drip-logo')">💧 Dripping Logo</button>
            <button class="preset-btn" onclick="setPreset('badge-design')">🏷️ Badge Design</button>
        </div>

        <button class="generate-btn" onclick="generateLogo()" id="generateBtn">
            🎨 Generate Vanilla Logo
        </button>
    </div>

    <div class="results-container">
        <div class="results-grid" id="results">
            <!-- Generated logos will appear here -->
        </div>
    </div>

    <script>
        let generatedLogos = [];

        const presets = {
            'ice-cream-cone': 'A minimalist vanilla ice cream cone logo for Websim, featuring a geometric cone with perfect vanilla scoop on top, clean lines, cream and beige colors, with subtle "W" letterform integrated into the cone design',
            'scoop-w': 'A vanilla ice cream scoop shaped like the letter "W" for Websim, creamy texture, soft vanilla colors, modern minimalist design with clean typography',
            'vanilla-bean': 'An elegant vanilla bean pod logo for Websim, sophisticated brown vanilla bean with modern web design elements, clean professional appearance',
            'drip-logo': 'A playful vanilla ice cream dripping logo for Websim, melting vanilla ice cream forming "W" shape, soft cream colors with gentle drip effects',
            'badge-design': 'A circular badge logo for Websim featuring vanilla ice cream elements, modern flat design with vanilla color scheme, clean professional appearance'
        };

        function setPreset(presetKey) {
            document.getElementById('logoPrompt').value = presets[presetKey];
        }

        async function generateLogo() {
            const prompt = document.getElementById('logoPrompt').value;
            const style = document.getElementById('logoStyle').value;
            const colorScheme = document.getElementById('colorScheme').value;
            const generateBtn = document.getElementById('generateBtn');
            
            if (!prompt.trim()) {
                alert('Please enter a logo description!');
                return;
            }

            // Disable button and show loading
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<div class="spinner"></div>Analyzing references and generating...';

            try {
                // First, analyze the reference images for color palette
                const colorAnalysis = await websim.chat.completions.create({
                    messages: [
                        {
                            role: "system",
                            content: `You are a color palette expert. Analyze these reference images and extract a detailed color palette description for logo design. Focus on the specific hex codes, gradients, and color relationships that would work well for a Websim Vanilla logo.`
                        },
                        {
                            role: "user",
                            content: [
                                {
                                    type: "text",
                                    text: "Analyze these Websim reference images and provide a detailed color palette description for creating a vanilla ice cream themed logo. Include specific colors, gradients, and how they should be used."
                                },
                                {
                                    type: "image_url",
                                    image_url: { url: "/a/7fd0da90-4658-48b7-91ea-26597c39bbad" }
                                },
                                {
                                    type: "image_url", 
                                    image_url: { url: "/a/51715d5d-3cca-4ec3-aeea-5be53a512ee4" }
                                }
                            ]
                        }
                    ]
                });

                const detailedColorPalette = colorAnalysis.content;

                // Build the full prompt with enhanced color information
                let fullPrompt = `${prompt}, ${style} style`;
                
                // Add enhanced color scheme context based on AI analysis
                switch(colorScheme) {
                    case 'vanilla':
                        fullPrompt += `, vanilla cream colors (beige, cream, light brown, off-white) combined with: ${detailedColorPalette}`;
                        break;
                    case 'websim':
                        fullPrompt += `, using these specific Websim brand colors: ${detailedColorPalette}`;
                        break;
                    case 'mixed':
                        fullPrompt += `, mixing vanilla cream colors with Websim brand colors: ${detailedColorPalette}`;
                        break;
                    case 'monochrome':
                        fullPrompt += `, monochrome design based on the tonal values from: ${detailedColorPalette}`;
                        break;
                }

                fullPrompt += ', logo design, clean background, professional, high quality, vector-style illustration';

                // Generate the image
                const result = await websim.imageGen({
                    prompt: fullPrompt,
                    transparent: true,
                    aspect_ratio: "1:1"
                });

                // Add to results
                const logoData = {
                    url: result.url,
                    prompt: fullPrompt,
                    colorAnalysis: detailedColorPalette,
                    timestamp: new Date().toLocaleTimeString()
                };

                generatedLogos.unshift(logoData);
                displayResults();

            } catch (error) {
                console.error('Error generating logo:', error);
                alert('Failed to generate logo. Please try again!');
            } finally {
                // Re-enable button
                generateBtn.disabled = false;
                generateBtn.innerHTML = '🎨 Generate Vanilla Logo';
            }
        }

        function displayResults() {
            const resultsContainer = document.getElementById('results');
            
            resultsContainer.innerHTML = generatedLogos.map((logo, index) => `
                <div class="result-card">
                    <div class="result-image">
                        <img src="${logo.url}" alt="Generated Websim Vanilla Logo">
                    </div>
                    <div class="logo-title">Generated Logo #${generatedLogos.length - index}</div>
                    <div class="logo-description">Created at ${logo.timestamp}</div>
                    <div class="prompt-used">"${logo.prompt}"</div>
                    ${logo.colorAnalysis ? `<div class="prompt-used"><strong>Color Analysis:</strong> ${logo.colorAnalysis.substring(0, 150)}...</div>` : ''}
                    <div class="rating-stars">
                        <span class="star">⭐</span>
                        <span class="star">⭐</span>
                        <span class="star">⭐</span>
                        <span class="star">⭐</span>
                        <span class="star">⭐</span>
                    </div>
                </div>
            `).join('');

            // Re-add star rating functionality
            document.querySelectorAll('.rating-stars').forEach(starContainer => {
                const stars = starContainer.querySelectorAll('.star');
                
                stars.forEach((star, index) => {
                    star.addEventListener('click', () => {
                        stars.forEach((s, i) => {
                            s.classList.toggle('active', i <= index);
                        });
                    });
                });
            });
        }

        // Allow Enter key to generate
        document.getElementById('logoPrompt').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                generateLogo();
            }
        });
    </script>
